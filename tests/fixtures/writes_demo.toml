[playbook]
id = "writes_demo"
description = "single writes=true task behind a derived gate, for worktree-wiring test"

[[step]]
id = "req"
role = "product_owner"
produces = "requirement_artifact"
gate = "none"

[[step]]
id = "approval"
role = "system"
type = "derived_gate"
needs = ["req"]

[[step]]
id = "code"
role = "developer"
needs = ["approval"]
produces = "code_diff_artifact"
gate = "none"
writes = true
